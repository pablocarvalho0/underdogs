name: Painel

# Regera o painel (npm run report) e publica no GitHub Pages a cada push na main.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Criar .venv (o runner.js procura o python em .venv/bin)
        run: |
          python -m venv .venv
          .venv/bin/pip install -q -e ".[dev]"
      - name: Gerar painel
        run: npm run report
      - uses: actions/upload-pages-artifact@v3
        with:
          path: painel

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
