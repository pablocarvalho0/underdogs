[project]
name = "underdogs-tarvo"
version = "0.1.0"
description = "Solução de fechamento financeiro automatizado com rastreabilidade total para Tarvo Pagamentos - Desafio Barte AI"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Pablo Carvalho", email = "pablo@example.com" }
]
dependencies = [
    "pandas>=2.2.0",
    "openpyxl>=3.1.2",
    "ofxparse>=0.21",
    "python-dateutil>=2.9.0",
    "pydantic>=2.7.0",
    "rich>=13.7.0",
    "typer>=0.12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
